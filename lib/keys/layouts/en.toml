[layout]
name = "English (US) - QWERTY"

# Numbers

[[layout.key]]
name = "BACKTICK"
normal = '`'
shifted = '~'

[[layout.key]]
name = "N1"
normal = '1'
shifted = '!'

[[layout.key]]
name = "N2"
normal = '2'
shifted = '@'

[[layout.key]]
name = "N3"
normal = '3'
shifted = '#'

[[layout.key]]
name = "N4"
normal = '4'
shifted = '$'

[[layout.key]]
name = "N5"
normal = '5'
shifted = '%'

[[layout.key]]
name = "N6"
normal = '6'
shifted = '^'

[[layout.key]]
name = "N7"
normal = '7'
shifted = '&'

[[layout.key]]
name = "N8"
normal = '8'
shifted = '*'

[[layout.key]]
name = "N9"
normal = '9'
shifted = '('

[[layout.key]]
name = "N0"
normal = '0'
shifted = ')'

[[layout.key]]
name = "MINUS"
normal = '-'
shifted = '_'

[[layout.key]]
name = "EQUAL"
normal = '='
shifted = '+'

# Top letters

[[layout.key]]
name = "Q"
normal = 'q'
shifted = 'Q'

[[layout.key]]
name = "W"
normal = 'w'
shifted = 'W'

[[layout.key]]
name = "E"
normal = 'e'
shifted = 'E'

[[layout.key]]
name = "R"
normal = 'r'
shifted = 'R'

[[layout.key]]
name = "T"
normal = 't'
shifted = 'T'

[[layout.key]]
name = "Y"
normal = 'y'
shifted = 'Y'

[[layout.key]]
name = "U"
normal = 'u'
shifted = 'U'

[[layout.key]]
name = "I"
normal = 'i'
shifted = 'I'

[[layout.key]]
name = "O"
normal = 'o'
shifted = 'O'

[[layout.key]]
name = "P"
normal = 'p'
shifted = 'P'

[[layout.key]]
name = "BRACKET_OPEN"
normal = '['
shifted = '{'

[[layout.key]]
name = "BRACKET_CLOSE"
normal = ']'
shifted = '}'

[[layout.key]]
name = "BACKSLASH"
normal = '\'
shifted = '|'

# Middle letters

[[layout.key]]
name = "A"
normal = 'a'
