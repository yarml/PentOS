normal = 'g'
shifted = 'G'

[[layout.key]]
name = "H"
normal = 'h'
shifted = 'H'

[[layout.key]]
name = "J"
normal = 'j'
shifted = 'J'

[[layout.key]]
name = "K"
normal = 'k'
shifted = 'K'

[[layout.key]]
name = "L"
normal = 'l'
shifted = 'L'

[[layout.key]]
name = "SEMICOLON"
normal = ';'
shifted = ':'

[[layout.key]]
name = "QUOTE"
