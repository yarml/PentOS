[workspace]
members = [
    "pentos",
    "config",
    "system/kernel",
    "system/bootloader",
    "system/klib",
    "system/system",
    "system/boot-protocol",
    "system/lib/x64",
    "system/lib/elf",
    "system/lib/spinlocks",
    "system/lib/acpi",
    "system/lib/log-debugcon",
    "system/lib/utils",
    "build-system/chef",
    "build-system/builder",
]
resolver = "3"

package.edition = "2024"
package.license = " GPL-3.0-or-later"
package.authors = ["Youssef Harmal"]

[workspace.dependencies]
log = "0.4.29"
config = { path = "config" }
klib = { path = "system/klib" }
system = { path = "system/system" }
boot-protocol = { path = "system/boot-protocol" }
x64 = { path = "system/lib/x64" }
elf = { path = "system/lib/elf" }
builder = { path = "build-system/builder" }
spinlocks = { path = "system/lib/spinlocks" }
acpi = { path = "system/lib/acpi" }
utils = { path = "system/lib/utils" }
log-debugcon = { path = "system/lib/log-debugcon" }

[workspace.metadata.chef]
ovmf-version = "edk2-stable202511-r1"
ovmf-source-template = "https://github.com/rust-osdev/ovmf-prebuilt/releases/download/$$/$$-bin.tar.xz"
ovmf-varsfd-path-template = "$$-bin/x64/vars.fd"
ovmf-codefd-path-template = "$$-bin/x64/code.fd"

install-bootloader = "/boot/efi/pentos.efi"
install-kernel = "/boot/efi/pentos.kernel"
