[workspace]
members = [
    "pentos",
    "config",
    "system/kernel",
    "system/bootloader",
    "system/klib",
    "system/system",
    "system/boot-protocol",
    "lib/x64",
    "lib/elf",
    "lib/spinlocks",
    "lib/acpi",
    "lib/log-debugcon",
    "lib/utils",
    "macros/klib-macros",
    "build-system/chef",
    "build-system/builder",
    "test",
]
resolver = "3"

package.edition = "2024"
package.license = " GPL-3.0-or-later"
package.authors = ["Youssef Harmal"]

[workspace.dependencies]
# Chef dependencies
cargo_metadata = "0.23.1"
clap = { version = "4.5.60", features = ["derive"] }
colored = "3.1.1"
reqwest = { version = "0.13.2", features = ["blocking"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.149"
tar = "0.4.44"
xz = "0.1.0"

# Builder dependencies
nasm-rs = "0.3.2"

# Macro dependencies
syn = { version = "2.0.117", features = ["full"] }
quote = "1.0.45"
proc-macro2 = "1.0.106"

# Bootloader dependencies
uefi = { version = "0.36.1" }

# Loggin system
# TODO: self-host this
log = "0.4.29"

# local crates
config = { path = "config" }
klib = { path = "system/klib" }
system = { path = "system/system" }
boot-protocol = { path = "system/boot-protocol" }
x64 = { path = "lib/x64" }
elf = { path = "lib/elf" }
builder = { path = "build-system/builder" }
spinlocks = { path = "lib/spinlocks" }
acpi = { path = "lib/acpi" }
utils = { path = "lib/utils" }
log-debugcon = { path = "lib/log-debugcon" }

[workspace.metadata.chef]
ovmf-version = "edk2-stable202511-r1"
ovmf-source-template = "https://github.com/rust-osdev/ovmf-prebuilt/releases/download/$$/$$-bin.tar.xz"
ovmf-varsfd-path-template = "$$-bin/x64/vars.fd"
ovmf-codefd-path-template = "$$-bin/x64/code.fd"

install-bootloader = "/boot/efi/pentos.efi"
install-kernel = "/boot/efi/pentos.kernel"
